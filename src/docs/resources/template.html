<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illusion Modules</title>
<meta name="description" content="Every module and setting in Illusion {{version}}.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap">
<style>
:root {
	color-scheme: dark;
	--seed: #29E38F;
	--seed-wash: rgba(41, 227, 143, 0.38);
	--surface: #0E1510;
	--surface-low: #151D18;
	--container: #18221C;
	--container-high: #1F2D24;
	--container-highest: #28382E;
	--primary: #42E092;
	--secondary-container: #234F36;
	--on-secondary-container: #BDEECF;
	--tertiary-container: #004F59;
	--on-tertiary-container: #9BF0FF;
	--on-accent: #002D17;
	--divider: rgba(51, 76, 61, 0.56);
	--text: #D3E7DA;
	--muted: #B0CEBA;
	--faint: #7B9785;
	--warning: #FFC107;
{{icons}}}

* {
	box-sizing: border-box;
}

html {
	scrollbar-color: var(--container-highest) var(--surface);
	scroll-padding-top: 24px;
}

body {
	margin: 0;
	background: var(--surface);
	color: var(--text);
	font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	font-optical-sizing: auto;
	caret-color: var(--seed);
}

::selection {
	background: var(--seed-wash);
}

a {
	color: inherit;
	text-decoration: none;
}

:focus-visible {
	outline: 2px solid var(--seed);
	outline-offset: 2px;
}

.icon {
	flex: none;
	width: 16px;
	height: 16px;
	background: currentColor;
	-webkit-mask: var(--icon) center / contain no-repeat;
	mask: var(--icon) center / contain no-repeat;
}

.shell {
	display: grid;
	grid-template-columns: 260px minmax(0, 1fr);
	min-height: 100vh;
}

.sidebar {
	position: sticky;
	top: 0;
	display: flex;
	flex-direction: column;
	height: 100vh;
	background: var(--surface-low);
}

.title {
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 20px 20px 16px;
	border-bottom: 1px solid var(--divider);
}

.title .logo {
	width: 18px;
	height: 16px;
	color: var(--seed);
	--icon: var(--icon-logo);
}

.title strong {
	display: block;
	font-weight: 600;
	line-height: 1.3;
}

.version {
	display: block;
	overflow: hidden;
	color: var(--faint);
	font-size: 12px;
	font-variant-numeric: tabular-nums;
	line-height: 1.3;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.title > span:last-child {
	min-width: 0;
}

.tools {
	display: flex;
	flex-direction: column;
	gap: 10px;
	padding: 16px 12px 8px;
}

.search {
	display: flex;
	align-items: center;
	gap: 8px;
	height: 36px;
	padding: 0 14px;
	border-radius: 9999px;
	background: var(--container-high);
	color: var(--faint);
	cursor: text;
}

.search:hover {
	background: var(--container-highest);
}

.search:focus-within {
	box-shadow: inset 0 0 0 1px var(--seed);
}

.search .icon {
	width: 14px;
	height: 14px;
	--icon: var(--icon-search);
}

#search {
	flex: 1;
	min-width: 0;
	padding: 0;
	border: 0;
	background: none;
	color: var(--text);
	font: inherit;
	font-size: 14px;
	outline: none;
}

#search::placeholder {
	color: var(--faint);
}

#search::-webkit-search-cancel-button {
	display: none;
}

.search kbd {
	padding: 0 6px;
	border-radius: 4px;
	background: var(--container);
	color: var(--faint);
	font: inherit;
	font-size: 12px;
}

.search:focus-within kbd {
	visibility: hidden;
}

.channels {
	display: grid;
	grid-template-columns: 1fr 1fr;
	padding: 3px;
	border-radius: 9999px;
	background: var(--container);
	font-size: 13px;
	font-weight: 500;
	text-align: center;
}

.channels a {
	padding: 3px 0;
	border-radius: 9999px;
	color: var(--muted);
}

.channels a:hover {
	background: var(--container-high);
	color: var(--text);
}

.channels a.active {
	background: var(--secondary-container);
	color: var(--on-secondary-container);
}

.toc {
	flex: 1;
	overflow-y: auto;
	padding: 8px 12px 24px;
	scrollbar-width: thin;
	scrollbar-color: var(--container-highest) transparent;
}

.group + .group {
	margin-top: 8px;
}

.entry {
	display: flex;
	align-items: center;
	gap: 10px;
	min-height: 30px;
	padding: 0 14px 0 40px;
	border-radius: 9999px;
	color: var(--faint);
	font-size: 14px;
}

.entry.category {
	padding-left: 14px;
	color: var(--muted);
	font-weight: 500;
}

.entry:hover {
	background: var(--container-high);
	color: var(--text);
}

.entry.current {
	color: var(--text);
}

.entry.category.selected {
	background: var(--secondary-container);
	color: var(--on-secondary-container);
}

.entry .count {
	margin-left: auto;
	color: var(--faint);
	font-size: 12px;
	font-weight: 400;
	font-variant-numeric: tabular-nums;
}

.entry.selected .count {
	color: inherit;
}

main {
	width: 100%;
	max-width: 820px;
	padding: 40px 48px 120px;
}

.page-head {
	display: flex;
	align-items: baseline;
	gap: 16px;
}

.page-head h1 {
	margin: 0;
	font-size: 30px;
	font-weight: 600;
	letter-spacing: -0.02em;
	line-height: 1.2;
}

#count {
	margin-left: auto;
	color: var(--faint);
	font-size: 14px;
	font-variant-numeric: tabular-nums;
}

.lede {
	max-width: 60ch;
	margin: 8px 0 0;
	color: var(--muted);
}

.empty {
	margin: 48px 0 0;
	color: var(--muted);
}

.category > h2 {
	display: flex;
	align-items: center;
	gap: 10px;
	margin: 56px 0 16px;
	font-size: 21px;
	font-weight: 600;
	letter-spacing: -0.01em;
}

.category > h2 .icon {
	width: 18px;
	height: 18px;
	color: var(--seed);
}

.module + .module {
	margin-top: 16px;
}

.module-head {
	display: flex;
	align-items: center;
	gap: 16px;
	padding: 14px 18px;
	border-radius: 6px;
	background: var(--container-high);
}

.module-head:has(+ .settings) {
	border-radius: 6px 6px 0 0;
}

.module-head h3 {
	margin: 0;
	font-size: 16px;
	font-weight: 600;
}

.module-head h3 a:hover {
	color: var(--primary);
}

.module-head p {
	margin: 2px 0 0;
	color: var(--muted);
	font-size: 14px;
}

.settings {
	display: flex;
	flex-direction: column;
}

.setting {
	position: relative;
	padding: 12px 18px;
	background: var(--container);
}

.setting:hover {
	background: var(--container-high);
}

.setting::before {
	content: "";
	position: absolute;
	top: 0;
	right: 12px;
	left: 12px;
	height: 2px;
	background: var(--divider);
}

.setting:last-child {
	border-radius: 0 0 6px 6px;
}

.setting h4 {
	margin: 0;
	font-size: 14px;
	font-weight: 500;
}

.setting p {
	margin: 2px 0 0;
	color: var(--muted);
	font-size: 14px;
}

.setting .requires {
	color: var(--faint);
	font-size: 13px;
}

.requires em,
.requires strong {
	color: var(--muted);
	font-style: normal;
	font-weight: 500;
}

.module-head .warning,
.setting .warning {
	color: var(--warning);
}

[hidden] {
	display: none !important;
}

@media (max-width: 860px) {
	.shell {
		display: block;
	}

	.sidebar {
		position: static;
		height: auto;
	}

	.toc,
	.search kbd {
		display: none;
	}

	.tools {
		flex-direction: row;
		flex-wrap: wrap;
		padding: 12px 16px 16px;
	}

	.search {
		flex: 1 1 240px;
	}

	.channels {
		flex: 0 0 180px;
		align-items: center;
	}

	.title {
		padding: 16px;
	}

	main {
		padding: 28px 16px 96px;
	}
}

@media (max-width: 520px) {
	.channels {
		flex-grow: 1;
	}

	.setting {
		padding: 12px 14px;
	}

	.module-head {
		padding: 12px 14px;
	}
}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<a class="title" href="#"><span class="icon logo"></span><span><strong>Illusion</strong><span class="version">{{version}}</span></span></a>
<div class="tools">
<label class="search"><span class="icon"></span><input type="search" id="search" placeholder="Find a module or setting" aria-label="Find a module or setting" autocomplete="off"><kbd>/</kbd></label>
<nav class="channels" aria-label="Release channel"><a href="/docs/"{{stable}}>Stable</a><a href="/docs/@nightly/"{{nightly}}>Nightly</a></nav>
</div>
<nav class="toc" aria-label="Modules">
{{nav}}
</nav>
</aside>
<main>
<div class="page-head">
<h1>Modules</h1>
<span id="count">{{count}} modules</span>
</div>
<p class="lede">Every module in Illusion {{version}} and what its settings do.</p>
<p class="empty" id="empty" hidden></p>
{{body}}
</main>
</div>
<script>
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const total = count.textContent;
const entries = new Map([...document.querySelectorAll(".toc .entry")].map(entry => [entry.hash.slice(1), entry]));

search.addEventListener("input", () => {
	const query = search.value.trim().toLowerCase();
	let shown = 0;
	for (const module of document.querySelectorAll(".module")) {
		const head = module.querySelector(".module-head").textContent.toLowerCase();
		const moduleMatch = head.includes(query);
		let settingMatch = false;
		for (const setting of module.querySelectorAll(".setting")) {
			const match = moduleMatch || setting.dataset.search.includes(query);
			setting.hidden = !match;
			settingMatch ||= match;
		}
		module.hidden = !moduleMatch && !settingMatch;
		entries.get(module.id).hidden = module.hidden;
		if (!module.hidden) shown++;
	}
	for (const category of document.querySelectorAll(".category")) {
		category.hidden = !category.querySelector(".module:not([hidden])");
		entries.get(category.id).parentElement.hidden = category.hidden;
	}
	count.textContent = query ? shown + (shown === 1 ? " result" : " results") : total;
	empty.hidden = shown > 0;
	empty.textContent = "Nothing matches “" + search.value.trim() + "”. Try a shorter word.";
});

search.addEventListener("keydown", event => {
	if (event.key === "Escape" && search.value) {
		search.value = "";
		search.dispatchEvent(new Event("input"));
	} else if (event.key === "Enter") {
		document.querySelector(".module:not([hidden])")?.scrollIntoView();
	}
});

document.addEventListener("keydown", event => {
	if (event.key === "/" && document.activeElement !== search && !event.ctrlKey && !event.metaKey) {
		event.preventDefault();
		search.focus();
		search.select();
	}
});

const observer = new IntersectionObserver(observed => {
	for (const entry of observed) {
		if (!entry.isIntersecting) continue;
		for (const link of entries.values()) link.classList.remove("current", "selected");
		const link = entries.get(entry.target.id);
		link?.classList.add("current");
		entries.get(entry.target.closest(".category").id)?.classList.add("selected");
		link?.scrollIntoView({block: "nearest"});
	}
}, {rootMargin: "0px 0px -70% 0px"});
document.querySelectorAll(".module").forEach(module => observer.observe(module));
</script>
</body>
</html>
