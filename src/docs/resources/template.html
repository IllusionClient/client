<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illusion Modules</title>
<meta name="description" content="Every module and setting in Illusion {{version}}.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root {
	color-scheme: dark;
	--bg: #0c0c0c;
	--overlay-top: rgba(46, 204, 113, 0.314);
	--overlay-bottom: rgba(0, 0, 0, 0.314);
	--panel: rgba(24, 24, 24, 0.627);
	--row: rgba(12, 12, 12, 0.627);
	--hover: rgba(40, 40, 40, 0.627);
	--divider: rgba(255, 255, 255, 0.086);
	--text: #ffffff;
	--muted: #aaaaaa;
	--accent: #2ecc71;
	--warning: #ffc107;
}

* {
	box-sizing: border-box;
}

body {
	margin: 0;
	background: linear-gradient(var(--overlay-top), var(--overlay-bottom)) fixed, var(--bg);
	color: var(--text);
	font: 16px/1.6 Rubik, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

a {
	color: inherit;
	text-decoration: none;
}

.topbar {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 12px 20px;
	max-width: 1120px;
	margin: 0 auto;
	padding: 20px 16px;
	border-bottom: 1px solid var(--divider);
}

.brand {
	font-size: 20px;
	font-weight: 700;
	color: var(--accent);
}

.brand span {
	margin-left: 6px;
	color: var(--muted);
	font-weight: 400;
}

.version {
	color: var(--muted);
	font-size: 13px;
}

.channels {
	display: flex;
	padding: 2px;
	border-radius: 6px;
	background: var(--panel);
	font-size: 13px;
}

.channels a {
	padding: 2px 12px;
	border-radius: 4px;
	color: var(--muted);
}

.channels a:hover {
	color: var(--text);
}

.channels a.active {
	background: var(--accent);
	color: #fff;
	font-weight: 600;
}

#search {
	flex: 0 1 280px;
	margin-left: auto;
	padding: 7px 12px;
	border: 1px solid var(--divider);
	border-radius: 6px;
	background: var(--panel);
	color: var(--text);
	font: inherit;
	font-size: 14px;
	outline: none;
}

#search:focus {
	border-color: var(--accent);
}

.layout {
	display: grid;
	grid-template-columns: 200px minmax(0, 1fr);
	gap: 48px;
	max-width: 1120px;
	margin: 0 auto;
	padding: 0 16px;
}

.sidebar {
	position: sticky;
	top: 0;
	align-self: start;
	max-height: 100vh;
	overflow-y: auto;
	padding: 32px 0;
	scrollbar-width: thin;
	scrollbar-color: var(--hover) transparent;
}

.frame {
	margin-bottom: 12px;
	border-radius: 6px;
	overflow: hidden;
	font-size: 14px;
}

.frame a {
	display: block;
	padding: 5px 12px;
	background: var(--row);
	color: var(--text);
}

.frame a + a {
	border-top: 1px solid var(--divider);
}

.frame a:hover {
	background: var(--hover);
}

.frame a.current {
	color: var(--accent);
}

.frame .frame-head {
	padding: 6px 12px;
	background: var(--accent);
	color: #fff;
	font-weight: 600;
}

main {
	max-width: 780px;
	padding: 32px 0 96px;
}

main > h1 {
	margin: 0;
	font-size: 32px;
	line-height: 1.2;
}

main > p {
	margin: 8px 0 0;
	color: var(--muted);
}

.category > h2 {
	margin: 56px 0 0;
	padding-bottom: 8px;
	border-bottom: 1px solid var(--divider);
	font-size: 24px;
}

.module {
	margin-top: 32px;
	scroll-margin-top: 16px;
}

.module h3 {
	margin: 0 0 4px;
	font-size: 19px;
}

.module h3 a:hover {
	color: var(--accent);
}

.module > p {
	margin: 0;
	color: var(--text);
}

.none {
	color: var(--muted) !important;
	font-size: 14px;
}

.warning {
	color: var(--warning) !important;
}

.settings {
	margin-top: 14px;
	border-radius: 6px;
	background: var(--panel);
	overflow: hidden;
}

.setting {
	padding: 12px 16px;
}

.setting + .setting {
	border-top: 1px solid var(--divider);
}

.setting h4 {
	margin: 0;
	font-size: 15px;
	font-weight: 600;
}

.setting p {
	margin: 2px 0 0;
	color: var(--muted);
	font-size: 14px;
}

.setting .requires {
	font-size: 13px;
}

.requires strong {
	color: var(--text);
	font-weight: 600;
}

.requires em {
	color: var(--accent);
	font-style: normal;
}

[hidden] {
	display: none !important;
}

@media (max-width: 860px) {
	.layout {
		display: block;
	}

	.sidebar {
		display: none;
	}

	#search {
		flex-basis: 100%;
	}
}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="#">Illusion<span>docs</span></a>
<span class="version">{{version}}</span>
<nav class="channels"><a href="/docs/"{{stable}}>Stable</a><a href="/docs/@nightly/"{{nightly}}>Nightly</a></nav>
<input type="search" id="search" placeholder="Search modules and settings" aria-label="Search modules and settings">
</header>
<div class="layout">
<nav class="sidebar">
{{nav}}
</nav>
<main>
<h1>Modules</h1>
<p>Every module in Illusion {{version}} and what its settings do.</p>
{{body}}
</main>
</div>
<script>
const search = document.getElementById("search");
search.addEventListener("input", () => {
	const query = search.value.trim().toLowerCase();
	for (const module of document.querySelectorAll(".module")) {
		const moduleMatch = (module.querySelector("h3").textContent + " " + module.querySelector(":scope > p").textContent).toLowerCase().includes(query);
		let settingMatch = false;
		for (const setting of module.querySelectorAll(".setting")) {
			const match = moduleMatch || setting.dataset.search.includes(query);
			setting.hidden = !match;
			settingMatch ||= match;
		}
		module.hidden = !moduleMatch && !settingMatch;
	}
	for (const category of document.querySelectorAll(".category")) {
		category.hidden = !category.querySelector(".module:not([hidden])");
	}
});

const links = new Map([...document.querySelectorAll(".frame a:not(.frame-head)")].map(link => [link.hash.slice(1), link]));
const observer = new IntersectionObserver(entries => {
	for (const entry of entries) {
		if (!entry.isIntersecting) continue;
		for (const link of links.values()) link.classList.remove("current");
		links.get(entry.target.id)?.classList.add("current");
	}
}, {rootMargin: "0px 0px -70% 0px"});
document.querySelectorAll(".module").forEach(module => observer.observe(module));
</script>
</body>
</html>
