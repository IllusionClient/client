plugins {
    alias(libs.plugins.loom)
    alias(libs.plugins.ploceus)
}

base {
    archivesName = project.archives_base_name
}
version = "${project.version}+mc${libs.versions.minecraft.get()}"
group = project.maven_group

sourceSets {
    standalone
    docs {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

repositories {
	maven {
		url "https://maven.ornithemc.net/releases"
	}
	maven {
		url 'https://jitpack.io/'
		content {
			includeGroup 'io.github.nevalackin'
		}
	}
}

dependencies {
    minecraft libs.minecraft
	mappings libs.feather
	modImplementation libs.loader

	implementation libs.radbus
    include libs.radbus

	ploceus.dependOsl(libs.versions.osl.get())
}

processResources {
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = it.name == 'compileStandaloneJava' ? 8 : 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

jar {
    from sourceSets.standalone.output
    manifest {
        attributes 'Main-Class': 'org.codeberg.illusionclient.Main'
    }

    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.register('docs', JavaExec) {
    group = 'documentation'
    description = 'Generates the module documentation page.'

    def output = layout.buildDirectory.file('docs/index.html')
    def channel = findProperty('channel') ?: 'stable'
    inputs.property 'version', version
    inputs.property 'channel', channel
    outputs.file output

    workingDir = layout.buildDirectory.dir('docs-run').get().asFile
    doFirst { workingDir.mkdirs() }
    classpath = sourceSets.docs.runtimeClasspath
    mainClass = 'org.codeberg.illusionclient.docs.DocsGenerator'
    args output.get().asFile.path, version, channel
}
