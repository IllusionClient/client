plugins {
    alias(libs.plugins.loom)
    alias(libs.plugins.ploceus)
}

base {
    archivesName = project.archives_base_name
}
version = "${project.version}+mc${libs.versions.minecraft.get()}"
group = project.maven_group

sourceSets {
    standalone
    docs {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

repositories {
	maven {
		url = "https://maven.ornithemc.net/releases"
	}
	maven {
		url = 'https://jitpack.io/'
		content {
			includeGroup 'io.github.nevalackin'
		}
	}
}

dependencies {
    minecraft libs.minecraft
	mappings libs.feather
	modImplementation libs.loader

	implementation libs.radbus
    include libs.radbus

	ploceus.dependOsl(libs.versions.osl.get())
}

processResources {
    def modVersion = version.toString()
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = it.name == 'compileStandaloneJava' ? 8 : 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

jar {
    from sourceSets.standalone.output
    manifest {
        attributes 'Main-Class': 'org.codeberg.illusionclient.Main'
    }

    def archivesName = base.archivesName
    from('LICENSE') {
        rename { "${it}_${archivesName.get()}" }
    }
}

tasks.register('docs', JavaExec) {
    group = 'documentation'
    description = 'Generates the module documentation page.'

    def output = layout.buildDirectory.file('docs/index.html')
    def runDir = layout.buildDirectory.dir('docs-run')
    def docsVersion = version.toString()
    def channel = providers.gradleProperty('channel').orElse('stable')

    inputs.property 'version', docsVersion
    inputs.property 'channel', channel
    outputs.file output

    classpath = sourceSets.docs.runtimeClasspath
    mainClass = 'org.codeberg.illusionclient.docs.DocsGenerator'
    workingDir = runDir
    argumentProviders.add({
        [output.get().asFile.absolutePath, docsVersion, channel.get()]
    } as CommandLineArgumentProvider)

    doFirst { runDir.get().asFile.mkdirs() }
}
