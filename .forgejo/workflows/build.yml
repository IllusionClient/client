name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: codeberg-medium

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build buildAndCollect docs --no-daemon

      - name: Upload artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: illusion
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish nightly docs
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ./gradlew docs --no-daemon -Pversion="nightly-${GITHUB_SHA::7}" -Pchannel=nightly
          cd build/docs
          git init -q -b nightly
          git add index.html
          git -c user.name=forgejo-actions -c user.email=actions@noreply.codeberg.org commit -q -m "docs: nightly ${GITHUB_SHA::7}"
          git push -f "https://token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${OWNER}/docs.git" nightly
