name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: codeberg-medium

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build buildAndCollect docs --no-daemon -Pversion="${GITHUB_REF_NAME#v}"

      - name: Collect binary
        run: |
          mkdir dist
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;

      - name: Read changelog
        id: changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^#+ / { found = ($2 == version || $2 == "v" version); next } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            cat notes.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: dist
          release-notes: ${{ steps.changelog.outputs.notes }}

      - name: Publish docs
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cd build/docs
          git init -q -b pages
          git add index.html
          git -c user.name=forgejo-actions -c user.email=actions@noreply.codeberg.org commit -q -m "docs: ${GITHUB_REF_NAME}"
          git push -f "https://token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${OWNER}/docs.git" pages
